<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoZoo - Naturaleza Viva</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header & Nav Responsive */
        .header {
            background-color: #1b4332;
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 2rem;
        }

        .logo-text {
            font-size: 1.4rem;
        }

        .logo-text span {
            font-size: 0.8rem;
            display: block;
            color: #52b788;
        }

        nav {
            width: auto;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
            font-size: 0.95rem;
        }

        .nav-links a:hover {
            color: #52b788;
        }

        /* Main Container */
        main {
            flex: 1;
        }

        /* Banner Responsive */
        .hero-banner {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1534567153574-2b12153a87f0?auto=format&fit=crop&w=1200&q=80') center/cover;
            color: white;
            text-align: center;
            padding: 80px 20px;
        }

        .hero-banner h2 {
            font-size: clamp(1.8rem, 4vw, 3rem);
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .hero-banner p {
            font-size: clamp(1rem, 2vw, 1.2rem);
        }

        .hero-buttons {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            width: auto;
        }

        .btn-primary {
            background-color: #2d6a4f;
            color: white;
        }

        .btn-secondary {
            background-color: #d8f3dc;
            color: #1b4332;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Sections General */
        .section {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .section-title {
            text-align: center;
            color: #1b4332;
            margin-bottom: 30px;
            font-size: clamp(1.5rem, 3vw, 2rem);
        }

        /* Cards & Grid Responsive */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .badge {
            display: inline-block;
            align-self: flex-start;
            background: #d8f3dc;
            color: #1b4332;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* Categorías Filtro Responsive */
        .category-filter {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #2d6a4f;
            background: white;
            color: #2d6a4f;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .filter-btn.active, .filter-btn:hover {
            background: #2d6a4f;
            color: white;
        }

        /* Forms & Tables */
        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        form input, form textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .info-box {
            background: #e9f5ec;
            padding: 20px;
            border-radius: 8px;
        }

        /* Footer */
        .footer {
            background: #081c15;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: auto;
        }

        .social-links {
            margin-top: 10px;
        }

        .social-links a {
            color: #52b788;
            text-decoration: none;
            margin: 0 5px;
        }

        /* MEDIA QUERIES PARA ADAPTABILIDAD TOTAL */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 1rem;
            }

            .nav-links {
                justify-content: center;
                gap: 12px;
            }

            .contact-container {
                grid-template-columns: 1fr;
            }

            .hero-banner {
                padding: 60px 15px;
            }

            .hero-buttons {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .category-filter {
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 10px;
            }

            .section {
                padding: 25px 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Menú de Navegación -->
    <header class="header">
        <div class="logo-container">
            <span class="logo-icon">🌿</span>
            <h1 class="logo-text">EcoZooPuce <span>Naturaleza Viva</span></h1>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="#" onclick="navigate('home')">Inicio</a></li>
                <li><a href="#" onclick="navigate('animals')">Animales</a></li>
                <li><a href="#" onclick="navigate('services')">Servicios</a></li>
                <li><a href="#" onclick="navigate('education')">Educación</a></li>
                <li><a href="#" onclick="navigate('contact')">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenedor Principal -->
    <main id="app-content"></main>

    <!-- Pie de página -->
    <footer class="footer">
        <p>&copy; 2026 EcoZoo Naturaleza Viva - Todos los derechos reservados.</p>
        <div class="social-links">
            <a href="#">Facebook</a> | <a href="#">Instagram</a> | <a href="#">TikTok</a>
        </div>
    </footer>

    <!-- Lógica JavaScript -->
    <script>
        const animalsData = [
            // --- MAMÍFEROS ---
            { name: "León", category: "Mamíferos", image: "https://images.unsplash.com/photo-1546182990-dffeafbe841d?auto=format&fit=crop&w=500&q=80", description: "El gran felino conocido como el rey de la selva.", habitat: "Sabana africana", features: "Melena densa en machos, caza social en manada.", diet: "Carnívoro" },
            { name: "Elefante", category: "Mamíferos", image: "https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?auto=format&fit=crop&w=500&q=80", description: "El mamífero terrestre más grande del mundo.", habitat: "Bosques y sabanas", features: "Trompa multifuncional y colmillos de marfil.", diet: "Herbívoro" },
            { name: "Jirafa", category: "Mamíferos", image: "https://images.unsplash.com/photo-1547721064-da6cfb341d50?auto=format&fit=crop&w=500&q=80", description: "El animal más alto de la Tierra.", habitat: "Praderas africanas", features: "Cuello extremadamente largo y patrón único de manchas.", diet: "Herbívoro" },
            { name: "Tigre", category: "Mamíferos", image: "https://images.unsplash.com/photo-1561731216-c3a4d99437d5?auto=format&fit=crop&w=500&q=80", description: "Superdepredador de pelaje anaranjado con rayas negras.", habitat: "Bosques densos y selvas", features: "Excelente nadador y cazador solitario.", diet: "Carnívoro" },

            // --- AVES ---
            { name: "Águila Real", category: "Aves", image: "https://images.unsplash.com/photo-1611689342806-0863700ce1e4?auto=format&fit=crop&w=500&q=80", description: "Una de las aves de presa más impresionantes.", habitat: "Montañas y acantilados", features: "Visión agudísima y garras poderosas.", diet: "Carnívoro" },
            { name: "Flamenco", category: "Aves", image: "https://media.istockphoto.com/id/616135474/es/foto/flamencos-en-el-lago-kenia-%C3%A1frica.jpg?s=1024x1024&w=is&k=20&c=2FgWJEaiQrLtqUEnGoTApNV8_yaD_qby12whD1tjdEQ=", description: "Ave acuática conocida por su característico color rosado.", habitat: "Lagos salobres y humedales", features: "Pico curvo adaptado para filtrar alimento.", diet: "Filtrador (crustáceos y algas)" },
            { name: "Búho Real", category: "Aves", image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTj7sPccjR10nmkMZvCb_onGtCEtmnQEAyW1rAqVtKbVkhAzYL9bXKyUQQ&s=10", description: "Rapaz nocturna de mirada penetrante.", habitat: "Bosques y zonas rocosas", features: "Vuelo totalmente silencioso.", diet: "Carnívoro" },
            { name: "Tucán", category: "Aves", image: "https://images.unsplash.com/photo-1550853024-fae8cd4be47f?auto=format&fit=crop&w=500&q=80", description: "Ave tropical famosa por su pico largo y colorido.", habitat: "Selvas tropicales", features: "Pico ligero de queratina y plumaje vivo.", diet: "Frugívoro" },

            // --- REPTILES ---
            { name: "Tortuga Marina", category: "Reptiles", image: "https://images.unsplash.com/photo-1437622368342-7a3d73a34c8f?auto=format&fit=crop&w=500&q=80", description: "Reptil ancestral que migra miles de kilómetros.", habitat: "Arrecifes y océanos abiertos", features: "Caparazón hidrodinámico y grandes aletas.", diet: "Omnívoro" },
            { name: "Cocodrilo", category: "Reptiles", image: "https://images.unsplash.com/photo-1525382455947-f319bc05fb35?auto=format&fit=crop&w=500&q=80", description: "Gran reptil semiacuático con mordida poderosa.", habitat: "Ríos, pantanos y zonas costeras", features: "Piel escamosa y dura.", diet: "Carnívoro" },
            { name: "Camaleón", category: "Reptiles", image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSdPAr5eUlrF9iF5v1S5VuKDE10gj6QJ-7Mel7P57ONORE5n7nhSM49_76O&s=10", description: "Reptil famoso por cambiar de color.", habitat: "Bosques tropicales", features: "Ojos con movimiento independiente.", diet: "Insectívoro" },
            { name: "Iguana Verde", category: "Reptiles", image: "https://www.shutterstock.com/image-photo/young-green-iguana-perched-on-260nw-2700496977.jpg", description: "Gran lagarto arborícola nativo de América.", habitat: "Copas de los árboles cerca del agua", features: "Cresta dorsal de espinas y cola larga.", diet: "Herbívoro" },

            // --- ACUÁTICOS ---
            { name: "Delfín", category: "Acuáticos", image: "https://images.unsplash.com/photo-1570481662006-a3a1374699e8?auto=format&fit=crop&w=500&q=80", description: "Mamífero acuático altamente inteligente.", habitat: "Océanos y mares", features: "Comunicación mediante ecolocalización.", diet: "Piscívoro" },
            { name: "Tiburón Blanco", category: "Acuáticos", image: "https://images.unsplash.com/photo-1560275619-4662e36fa65c?auto=format&fit=crop&w=500&q=80", description: "El depredador marino más emblemático.", habitat: "Aguas templadas", features: "Múltiples filas de dientes aserrados.", diet: "Carnívoro" },
            { name: "Manta Raya", category: "Acuáticos", image: "https://capuchino.mx/wp-content/uploads/2022/12/Rayas-aguila.jpg", description: "Gigante pacífico del océano.", habitat: "Aguas tropicales", features: "Cuerpo aplanado con aletas gigantes.", diet: "Filtrador (plancton)" },
            { name: "Pez Payaso", category: "Acuáticos", image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTXiO58aVTR0Gy-AGtmCNJJ-qn4luiqDNrk0Dmo0Gobdq98CKLCzK6tF_th&s=10", description: "Pequeño pez de colores naranja y blanco.", habitat: "Arrecifes e anémonas", features: "Inmune al veneno de las anémonas.", diet: "Omnívoro" }
        ];

        function HomeComponent() {
            return `
                <section class="hero-banner">
                    <h2>Un encuentro salvaje con la naturaleza</h2>
                    <p>Descubre la biodiversidad y aprende a proteger nuestro planeta.</p>
                    <div class="hero-buttons">
                        <button class="btn btn-primary" onclick="navigate('animals')">Ver Animales</button>
                        <button class="btn btn-secondary" onclick="navigate('services')">Planear Visita</button>
                    </div>
                </section>

                <section class="section">
                    <h3 class="section-title">Sobre EcoZoo</h3>
                    <p style="text-align: center; max-width: 800px; margin: 0 auto 30px auto; line-height: 1.6;">
                        EcoZoo es un santuario biológico comprometido con el rescate, rehabilitación y conservación 
                        de especies amenazadas. Con más de 50 hectáreas de hábitats recreados, ofrecemos una experiencia
                        educativa e inmersiva para toda la familia.
                    </p>

                    <h3 class="section-title">Información Destacada</h3>
                    <div class="grid">
                        <div class="card">
                            <h4>🌱 Programa de Conservación</h4>
                            <p>Más de 30 especies rescatadas y reintegradas a sus hábitats naturales este año.</p>
                        </div>
                        <div class="card">
                            <h4>🦁 Experiencias Interactivas</h4>
                            <p>Recorridos guiados al atardecer para conocer el comportamiento nocturno de los grandes felinos.</p>
                        </div>
                        <div class="card">
                            <h4>🎟️ Descuentos Especiales</h4>
                            <p>Entrada gratuita para niños menores de 3 años y tarifas reducidas para grupos escolares.</p>
                        </div>
                    </div>
                </section>
            `;
        }

        function AnimalsComponent(filter = "Todos") {
            const categories = ["Todos", "Mamíferos", "Aves", "Reptiles", "Acuáticos"];
            const filteredAnimals = filter === "Todos" ? animalsData : animalsData.filter(a => a.category === filter);

            const filterButtonsHTML = categories.map(cat => `
                <button class="filter-btn ${cat === filter ? 'active' : ''}" onclick="filterAnimals('${cat}')">
                    ${cat}
                </button>
            `).join('');

            const cardsHTML = filteredAnimals.map(animal => `
                <div class="card">
                    <img src="${animal.image}" alt="${animal.name}" loading="lazy">
                    <span class="badge">${animal.category}</span>
                    <h3>${animal.name}</h3>
                    <p><strong>Descripción:</strong> ${animal.description}</p>
                    <p><strong>Hábitat:</strong> ${animal.habitat}</p>
                    <p><strong>Características:</strong> ${animal.features}</p>
                    <p><strong>Alimentación:</strong> ${animal.diet}</p>
                </div>
            `).join('');

            return `
                <section class="section">
                    <h2 class="section-title">Nuestros Animales</h2>
                    <div class="category-filter">
                        ${filterButtonsHTML}
                    </div>
                    <div class="grid">
                        ${cardsHTML}
                    </div>
                </section>
            `;
        }

        function ServicesComponent() {
            return `
                <section class="section">
                    <h2 class="section-title">Servicios para Visitantes</h2>
                    <div class="grid">
                        <div class="card">
                            <h3>🚶‍♂️ Visitas Guiadas</h3>
                            <p>Acompaña a nuestros biólogos en recorridos temáticos de 90 minutos.</p>
                        </div>
                        <div class="card">
                            <h3>🎓 Recorridos Educativos</h3>
                            <p>Diseñados para escuelas, enfocados en biología, ecología y preservación.</p>
                        </div>
                        <div class="card">
                            <h3>🍔 Zona de Alimentación</h3>
                            <p>Restaurantes y áreas de picnic con opciones saludables y vegetarianas.</p>
                        </div>
                        <div class="card">
                            <h3>🎁 Tienda de Recuerdos</h3>
                            <p>Adquiere souvenirs ecológicos; tus compras apoyan la conservación.</p>
                        </div>
                        <div class="card">
                            <h3>🎉 Eventos Especiales</h3>
                            <p>Celebración de cumpleaños y eventos corporativos en espacios al aire libre.</p>
                        </div>
                        <div class="card">
                            <h3>🎈 Actividades para Niños</h3>
                            <p>Talleres de arte, granja interactiva y zonas de juegos infantiles.</p>
                        </div>
                    </div>

                    <div style="margin-top: 40px;" class="grid">
                        <div class="info-box">
                            <h3>⏰ Horarios de Atención</h3>
                            <p><strong>Lunes a Viernes:</strong> 9:00 AM - 5:00 PM</p>
                            <p><strong>Sábados, Domingos y Festivos:</strong> 8:30 AM - 6:00 PM</p>
                        </div>
                        <div class="info-box">
                            <h3>🎟️ Precios de Entrada</h3>
                            <p><strong>Adultos (12+ años):</strong> $15.00</p>
                            <p><strong>Niños (3-11 años):</strong> $8.00</p>
                            <p><strong>Adultos Mayores / Estudiantes:</strong> $10.00</p>
                        </div>
                    </div>
                </section>
            `;
        }

        function EducationComponent() {
            return `
                <section class="section">
                    <h2 class="section-title">Educación y Conservación</h2>
                    <div class="grid">
                        <div class="card">
                            <h3>🛡️ Protección de Especies</h3>
                            <p>Participamos en programas internacionales de reproducción en cautiverio.</p>
                        </div>
                        <div class="card">
                            <h3>🌍 Cuidado del Medio Ambiente</h3>
                            <p>EcoZoo funciona con un 100% de energía renovable y cero plásticos.</p>
                        </div>
                        <div class="card">
                            <h3>📚 Programas Educativos</h3>
                            <p>Ofrecemos voluntariados, campamentos de verano y conferencias gratuitas.</p>
                        </div>
                    </div>

                    <div style="margin-top: 40px;">
                        <h3 class="section-title">💡 Datos Interesantes & Consejos</h3>
                        <div class="grid">
                            <div class="info-box">
                                <h4>¿Sabías qué?</h4>
                                <p>Las huellas de la nariz de las jirafas son únicas, equivalente a las huellas dactilares humanas.</p>
                            </div>
                            <div class="info-box">
                                <h4>Consejo Eco</h4>
                                <p>Reduce el uso de plásticos de un solo uso para evitar la contaminación de mares y hábitats terrestres.</p>
                            </div>
                        </div>
                    </div>
                </section>
            `;
        }

        function ContactComponent() {
            return `
                <section class="section">
                    <h2 class="section-title">Contacto y Ubicación</h2>
                    <div class="contact-container">
                        <form onsubmit="handleContactSubmit(event)">
                            <h3>Envíanos un mensaje</h3>
                            <div>
                                <label>Nombre:</label>
                                <input type="text" required placeholder="Tu nombre completo">
                            </div>
                            <div>
                                <label>Correo Electrónico:</label>
                                <input type="email" required placeholder="tu@email.com">
                            </div>
                            <div>
                                <label>Teléfono:</label>
                                <input type="tel" placeholder="(+593) 999999999">
                            </div>
                            <div>
                                <label>Mensaje:</label>
                                <textarea rows="4" required placeholder="¿En qué podemos ayudarte?"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Enviar Mensaje</button>
                        </form>

                        <div class="info-box">
                            <h3>Información del Zoológico</h3>
                            <p><strong>📍 Dirección:</strong> Av. Los Biomas #123, Reserva Ecología Verde</p>
                            <p><strong>🕒 Horarios:</strong> Lun-Dom 9:00 AM - 5:00 PM</p>
                            <p><strong>📞 Teléfono:</strong> (02) 2345-6789</p>
                            <p><strong>✉️ Email:</strong> contacto@ecozoo.org</p>
                            <br>
                            <h4>Redes Sociales</h4>
                            <p>Síguenos en @EcoZooOficial en todas las plataformas.</p>
                        </div>
                    </div>
                </section>
            `;
        }

        function navigate(view) {
            const app = document.getElementById("app-content");
            switch (view) {
                case "home": app.innerHTML = HomeComponent(); break;
                case "animals": app.innerHTML = AnimalsComponent(); break;
                case "services": app.innerHTML = ServicesComponent(); break;
                case "education": app.innerHTML = EducationComponent(); break;
                case "contact": app.innerHTML = ContactComponent(); break;
                default: app.innerHTML = HomeComponent();
            }
            window.scrollTo(0, 0);
        }

        function filterAnimals(category) {
            document.getElementById("app-content").innerHTML = AnimalsComponent(category);
        }

        function handleContactSubmit(event) {
            event.preventDefault();
            alert("¡Gracias por contactarnos! Te responderemos a la brevedad.");
            event.target.reset();
        }

        document.addEventListener("DOMContentLoaded", () => navigate("home"));
    </script>
</body>
</html>
